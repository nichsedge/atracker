[package]
name = "atracker-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
dirs = "6.0.0"
mime_guess = "2.0.5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4.0"
