<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background with smooth radial dark gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#0B0716" />
    </radialGradient>

    <!-- Main Gradient for the Loop -->
    <linearGradient id="loopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#8A3DFF" />
      <stop offset="100%" stop-color="#00FFD2" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F1635" stroke-width="6" />

  <!-- The Loop Path (Concept A) -->
  <path d="M 140 380 
           L 256 130 
           L 330 300 
           C 350 345, 410 345, 420 300 
           C 430 250, 380 230, 340 280 
           L 190 280" 
        fill="none" 
        stroke="url(#loopGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)" />
</svg>